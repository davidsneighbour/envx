name: Node version policy check

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check Node.js version declarations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Check Node.js version policy
        run: node scripts/check-node-version-policy.mjs --check --verbose
      - name: Summary
        if: always()
        run: node scripts/check-node-version-policy.mjs --format=json >> "$GITHUB_STEP_SUMMARY" || true
